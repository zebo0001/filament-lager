# Filament-Lager -- Testversion
#
# Eigenstaendiger Stack ohne Abhaengigkeit von Docker Swarm, Traefik, HAProxy
# oder GlusterFS. Laeuft unveraendert mit "docker compose up" auf Docker Desktop
# (Windows/Mac) genauso wie auf jedem Linux-Host mit Docker + Compose-Plugin.
#
# Enthaltene Dienste:
#   - storage:  eigenes Lagerplatz-Backend (FastAPI + SQLite)
#   - dashboard: Frontend (nginx, statische SPA + Reverse-Proxy zu storage/bridge)

services:
  storage:
    build: ./storage
    restart: unless-stopped
    shm_size: "512mb"  # Headless Chromium (Playwright) fuer Label-PNG/PDF-Export braucht mehr /dev/shm als der Docker-Default
    volumes:
      - storage_data:/data
    environment:
      - DB_PATH=/data/storage.db
      - SPOOLMAN_URL=http://127.0.0.1:8080/spoolman-v1

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8093}:80"
    depends_on:
      - storage
      - anycubic-bridge

  anycubic-bridge:
    build: ./bridge
    restart: unless-stopped
    volumes:
      - bridge_data:/data
    ports:
      - "${BRIDGE_PORT:-8094}:8080"
    depends_on:
      - storage

volumes:
  storage_data:
  bridge_data:
